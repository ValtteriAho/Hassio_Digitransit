# Digitransit Lovelace examples (v0.1.10+)
#
# Replace the entity IDs below with your own sensor IDs from Home Assistant.
# Example placeholders used:
# - sensor.melaniementie_kaarantie_b
# - sensor.melaniementie_kaarantie_b_next_3

# Option 1: Clean Markdown card with colored status dots
type: markdown
title: "Bus departures"
content: |
  {% set e = 'sensor.melaniementie_kaarantie_b' %}
  {% set deps = state_attr(e, 'departures') or [] %}
  {% set full_name = state_attr(e, 'stop_name') or 'Stop' %}
  {% set first_part = full_name.split(' / ')[0].strip() if ' / ' in full_name else full_name %}
  {% set stop_name = first_part[:24] ~ '...' if first_part | length > 24 else first_part %}

  **{{ stop_name }}**
  Next: **{{ states(e) }}**

  {% for dep in deps[:3] %}
  {% set color = dep.status_color or 'gray' %}
  {% if color == 'green' %}{% set dot = '🟢' %}
  {% elif color == 'red' %}{% set dot = '🔴' %}
  {% elif color == 'dodgerblue' %}{% set dot = '🔵' %}
  {% else %}{% set dot = '⚪' %}{% endif %}
  {{ dot }} **{{ dep.route }}** → {{ dep.destination }} at {{ dep.scheduled_time }} ({{ dep.minutes }} min) - {{ dep.status }}
  {% endfor %}

---

# Option 2: Entities card for quick overview
type: entities
title: "Bus departures"
show_header_toggle: false
entities:
  - entity: sensor.melaniementie_kaarantie_b
    name: Stop
  - entity: sensor.melaniementie_kaarantie_b_next_3
    name: Next 3
  - type: attribute
    entity: sensor.melaniementie_kaarantie_b
    attribute: lahto_1
    name: "Departure 1"
  - type: attribute
    entity: sensor.melaniementie_kaarantie_b
    attribute: lahto_2
    name: "Departure 2"
  - type: attribute
    entity: sensor.melaniementie_kaarantie_b
    attribute: lahto_3
    name: "Departure 3"

---

# Option 3: Multi-stop vertical card with status dots (recommended)
type: markdown
title: "Bussaikataulut"
content: |
  {% set stops = [
    'sensor.melaniementie_kaarantie_b',
    'sensor.huutoniementie_valitie'
  ] %}

  {% for stop_entity in stops %}
  {% set deps = state_attr(stop_entity, 'departures') or [] %}
  {% set full_name = state_attr(stop_entity, 'stop_name') or 'Stop' %}
  {% set first_part = full_name.split(' / ')[0].strip() if ' / ' in full_name else full_name %}
  {% set stop_name = first_part[:24] ~ '...' if first_part | length > 24 else first_part %}
  {% set next_mins = states(stop_entity) %}

  **{{ stop_name }}**
  Seuraava: **{{ next_mins }}**

  {% for dep in deps[:3] %}
  {% set color = dep.status_color or 'gray' %}
  {% if color == 'green' %}{% set dot = '🟢' %}
  {% elif color == 'red' %}{% set dot = '🔴' %}
  {% elif color == 'dodgerblue' %}{% set dot = '🔵' %}
  {% else %}{% set dot = '⚪' %}{% endif %}
  {{ dot }} **{{ dep.route }}** → {{ dep.destination }} | {{ dep.scheduled_time }} ({{ dep.minutes }} min)
  {% endfor %}

  ---
  {% endfor %}
